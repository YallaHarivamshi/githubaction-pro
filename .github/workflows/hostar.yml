name: Java CI/CD Pipeline to Tomcat

on:
  push:
    branches:
      - main

jobs:

  # =========================
  # BUILD + SONARQUBE
  # =========================
  build:
    runs-on: [self-hosted, linux]

    steps:

      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Maven if not installed
      - name: Ensure Maven is installed
        run: |
          if ! command -v mvn >/dev/null 2>&1; then
            echo "Maven not found. Installing Maven..."
            sudo dnf install -y maven
          else
            echo "Maven is already installed"
          fi

          mvn -version

      # 4. Cache Maven dependencies
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 5. Build Java application
      - name: Build with Maven
        run: |
          mvn clean package -DskipTests

      # 6. Upload WAR file
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp
          path: target/*.war

      # 7. SonarQube Analysis
      - name: SonarQube Analysis
        env:
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "Checking SonarQube..."

          curl -f --connect-timeout 10 --max-time 30 \
            "$SONAR_HOST/api/system/status"

          echo "Running SonarQube analysis..."

          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:3.9.1.2184:sonar \
            -Dsonar.projectKey=hotstar \
            -Dsonar.host.url="$SONAR_HOST" \
            -Dsonar.token="$SONAR_TOKEN"


  # =========================
  # DEPLOY TO TOMCAT
  # =========================
  deploy:
    runs-on: [self-hosted, linux]
    needs: build

    environment:
      name: production

    steps:

      # 8. Download WAR artifact
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp
          path: ./artifact

      # 9. Check WAR file
      - name: Check WAR file
        run: |
          echo "WAR files:"
          ls -lh ./artifact/

      # 10. Check Tomcat connection
      - name: Check Tomcat
        run: |
          echo "Checking Tomcat..."
          
          curl -I \
            --connect-timeout 10 \
            --max-time 30 \
            "http://${{ secrets.TOMCAT_HOST }}/"

      # 11. Deploy WAR to Tomcat
      - name: Deploy to Tomcat
        run: |
          WAR_FILE=$(find ./artifact -name "*.war" | head -n 1)

          if [ -z "$WAR_FILE" ]; then
            echo "ERROR: WAR file not found!"
            exit 1
          fi

          echo "Deploying WAR: $WAR_FILE"

          curl -v \
            --connect-timeout 10 \
            --max-time 300 \
            --upload-file "$WAR_FILE" \
            "http://${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}@${{ secrets.TOMCAT_HOST }}/manager/text/deploy?path=/myapp&update=true"

      # 12. Verify deployment
      - name: Verify deployment
        run: |
          echo "Checking deployed application..."

          curl -I \
            --connect-timeout 10 \
            --max-time 30 \
            "http://${{ secrets.TOMCAT_HOST }}/myapp"
